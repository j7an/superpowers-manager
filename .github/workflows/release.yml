name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  # One leg per tests/container.sh selector: together they are the full
  # container suite, and publish waits on the slowest leg instead of the sum.
  validate:
    name: Container validation (${{ matrix.selector }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        selector:
          - shared
          - harness-codex
          - harness-pi
          - harness-opencode
          - harness-claude-code
          - harness-hermes
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout at tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run container selector
        env:
          SPW_VALIDATE_SELECTOR: ${{ matrix.selector }}
        run: sh tests/container.sh "$SPW_VALIDATE_SELECTOR"

  publish:
    needs: validate
    permissions:
      contents: write # GitHub release, created by the reusable workflow
      id-token: write # npm trusted publishing; validated against THIS workflow's filename
    uses: j7an/shared-workflows/.github/workflows/publish-npm.yml@30425ad6ef4ee3c3cbccdd563b22de749887f622 # v4.11.0
    with:
      tag: ${{ github.ref_name }}
      package-name: superpowers-manager
      test-command: corepack enable && pnpm install --frozen-lockfile && pnpm run check:static
      pack-command: node tests/tools/pack.ts --out-dir .
      pack-contents-script: tests/assert_pack_contents.sh
      verify-command: |
        attempt=1
        for delay in 0 30 60 90 120 150; do
          if [ "$delay" -gt 0 ]; then
            echo "npx verification attempt ${attempt}/6: sleeping ${delay}s"
            sleep "$delay"
          else
            echo "npx verification attempt ${attempt}/6: checking before sleep"
          fi
          cache="${RUNNER_TEMP:-/tmp}/superpowers-manager-npx-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}-${attempt}"
          if actual=$(npm_config_cache="$cache" npx --yes "${PACKAGE}@${VERSION}" --version); then
            if [ "$actual" = "$VERSION" ]; then
              echo "npx resolved ${PACKAGE}@${VERSION}"
              exit 0
            fi
            echo "::error::npx resolved ${PACKAGE}@${VERSION} with unexpected version ${actual}" >&2
            exit 1
          fi
          attempt=$((attempt + 1))
        done
        echo "::error::npx verification failed after 6 attempts" >&2
        exit 1
