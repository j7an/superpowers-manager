name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the citation gate resolves `git show <sha>:path`
          # citations into commits that predate HEAD. A depth-1 checkout makes
          # every one of them unresolvable.
          fetch-depth: 0

      - name: Run container acceptance suite
        run: sh tests/container.sh

  toolchain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the citation gate resolves `git show <sha>:path`
          # citations into commits that predate HEAD. A depth-1 checkout makes
          # every one of them unresolvable.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Check toolchain and CLI build
        run: pnpm run check:static

      # The full suite runs in `test`. These suites also need the Git checkout
      # and history that are deliberately excluded from the container image.
      - name: Check tooling coverage and historical citations
        run: node --import ./tests/assert-matcher-gate.js --test tests/bin/tooling-coverage.test.js tests/bin/citations.test.js
