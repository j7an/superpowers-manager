name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor_id == '275375463' && github.actor == 'shared-workflows-release-bot[bot]' && 'release-bot' || 'ordinary' }}
  cancel-in-progress: true

permissions: {}

jobs:
  classify-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      skip_tests: ${{ steps.classify.outputs.skip_tests }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: release-bump verification compares immutable commits.
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Classify release bump
        id: classify
        run: node tests/tools/classify-release-bump.ts

  harness:
    name: ${{ matrix.name }} harness integration
    needs: classify-release
    if: ${{ !cancelled() && (needs.classify-release.result != 'success' || needs.classify-release.outputs.skip_tests != 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Codex
            selector: harness-codex
          - name: Pi
            selector: harness-pi
          - name: OpenCode
            selector: harness-opencode
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run ${{ matrix.name }} harness integration
        env:
          SPW_HARNESS_SELECTOR: ${{ matrix.selector }}
        run: sh tests/container.sh "$SPW_HARNESS_SELECTOR"

  toolchain:
    needs: classify-release
    if: ${{ !cancelled() && (needs.classify-release.result != 'success' || needs.classify-release.outputs.skip_tests != 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the citation gate resolves `git show <sha>:path`
          # citations into commits that predate HEAD. A depth-1 checkout makes
          # every one of them unresolvable.
          fetch-depth: 0

      - name: Set up package minimum Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.0.0"
          package-manager-cache: false

      - name: Preserve package minimum executable
        run: |
          node -e 'const m=/^>=(\d+)$/.exec(require("./package.json").engines.node); if (!m || process.versions.node !== `${m[1]}.0.0`) { console.error("package minimum Node setup did not match engines.node"); process.exit(1); }'
          printf 'SPW_PACKAGE_NODE=%s\n' "$(node -p 'process.execPath')" >> "$GITHUB_ENV"
          printf 'SPW_PACKAGE_NODE_VERSION=%s\n' "$(node -p 'process.versions.node')" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          check-latest: true

      - name: Enable Corepack
        run: corepack enable

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Check static toolchain
        run: pnpm run check:static

      - name: Run shared tests and package minimum checks
        run: sh tests/run.sh --require-package-node
