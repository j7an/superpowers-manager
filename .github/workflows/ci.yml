name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  harness-codex:
    name: Codex harness integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the citation gate resolves `git show <sha>:path`
          # citations into commits that predate HEAD. A depth-1 checkout makes
          # every one of them unresolvable.
          fetch-depth: 0

      - name: Run Codex harness integration
        run: sh tests/container.sh harness-codex

  harness-pi:
    name: Pi harness integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the citation gate resolves `git show <sha>:path`
          # citations into commits that predate HEAD. A depth-1 checkout makes
          # every one of them unresolvable.
          fetch-depth: 0

      - name: Run Pi harness integration
        run: sh tests/container.sh harness-pi

  toolchain:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - native: "24.12.0"
            static: false
          - native: "24"
            static: true
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the citation gate resolves `git show <sha>:path`
          # citations into commits that predate HEAD. A depth-1 checkout makes
          # every one of them unresolvable.
          fetch-depth: 0

      - name: Set up package minimum Node
        if: matrix.static
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.0.0"
          package-manager-cache: false

      - name: Preserve package minimum executable
        if: matrix.static
        run: |
          node -e 'const m=/^>=(\d+)$/.exec(require("./package.json").engines.node); if (!m || process.versions.node !== `${m[1]}.0.0`) { console.error("package minimum Node setup did not match engines.node"); process.exit(1); }'
          printf 'SPW_PACKAGE_NODE=%s\n' "$(node -p 'process.execPath')" >> "$GITHUB_ENV"
          printf 'SPW_PACKAGE_NODE_VERSION=%s\n' "$(node -p 'process.versions.node')" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.native }}
          check-latest: ${{ matrix.static }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Check native compatibility floor
        if: matrix.native == '24.12.0'
        run: |
          node --import ./tests/assert-matcher-gate.ts --test tests/bin/native-source.test.ts
          node --import ./tests/assert-matcher-gate.ts --test tests/bin/assert-matcher-gate.test.ts
          node --import ./tests/assert-matcher-gate.ts --test --test-name-pattern='^(compiler failure yields no package metadata or artifact|one staged package is delivered and all staging is removed)$' tests/bin/pack.test.ts

      - name: Check static toolchain
        if: matrix.static
        run: pnpm run check:static

      - name: Run shared tests and package minimum checks
        if: matrix.static
        run: sh tests/run.sh --require-package-node
