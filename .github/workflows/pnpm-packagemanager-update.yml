name: pnpm packageManager Update

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  update:
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    uses: j7an/shared-workflows/.github/workflows/pnpm-packagemanager-update.yml@143198c39c5008b0a6a4d02a0f0218127db3d5e1 # v4.7.1
    with:
      minimum_release_age_days: 5
    secrets:
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
